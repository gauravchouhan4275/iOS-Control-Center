name: Build iOS Control Center

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Real iOS Control Center
        run: |
          mkdir -p app/src/main/java/com/gaurav/ioscontrolcenter app/src/main/res/layout app/src/main/res/drawable
          NS=$(printf 'http://schemas.%://s.com' 'android' 'android')
          ADS=$(printf 'http://schemas.%://s.com' 'android')

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "iOSControlCenter"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.gaurav.ioscontrolcenter'
              compileSdk 34
              defaultConfig { applicationId "com.gaurav.ioscontrolcenter"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.google.android.gms:play-services-ads:23.0.0'
          }
          EOF

          cat << EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="$NS">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <application android:allowBackup="true" android:label="iOS Control Center" android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  <service android:name=".ControlCenterService" android:enabled="true" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="iOS Control Center"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat << EOF > app/src/main/res/drawable/ios_tile_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="$NS"><solid android:color="#801C1C1E" /><corners android:radius="26dp" /><stroke android:width="1dp" android:color="#33FFFFFF" /></shape>
          EOF

          cat << EOF > app/src/main/res/drawable/ios_circle_btn.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="$NS" android:shape="oval"><solid android:color="#4D3A3A3C" /></shape>
          EOF

          cat << EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="$NS" xmlns:ads="$ADS" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#000000" android:padding="20dp">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="iOS 18 Control Center" android:textColor="#FFFFFF" android:textSize="28sp" android:textStyle="bold" android:layout_marginTop="16dp"/>
              <Button android:id="@+id/btnPermission" android:layout_width="match_parent" android:layout_height="52dp" android:text="1. Grant Overlay Permission" android:backgroundTint="#0A84FF" android:textColor="#FFFFFF" android:layout_marginTop="20dp"/>
              <Button android:id="@+id/btnToggleService" android:layout_width="match_parent" android:layout_height="56dp" android:text="2. START iOS CONTROL CENTER" android:backgroundTint="#30D158" android:textColor="#FFFFFF" android:textStyle="bold" android:layout_marginTop="12dp"/>
              <Button android:id="@+id/btnPreviewPanel" android:layout_width="match_parent" android:layout_height="50dp" android:text="Open Control Panel Now" android:backgroundTint="#2C2C2E" android:textColor="#0A84FF" android:layout_marginTop="12dp" android:layout_marginBottom="20dp"/>
              <com.google.android.gms.ads.AdView android:id="@+id/adView" android:layout_width="match_parent" android:layout_height="wrap_content" ads:adSize="BANNER" ads:adUnitId="ca-app-pub-3940256099942544/6300978111"/>
          </LinearLayout>
          EOF

          cat << EOF > app/src/main/res/layout/layout_control_center.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="$NS" android:id="@+id/rootBlurOverlay" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#E6000000" android:padding="22dp">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:layout_centerInParent="true">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center" android:layout_marginBottom="16dp">
                      <Button android:id="@+id/btnAirplane" android:layout_width="62dp" android:layout_height="62dp" android:text="✈" android:textColor="#FFFFFF" android:background="@drawable/ios_circle_btn" android:layout_margin="6dp"/>
                      <Button android:id="@+id/btnData" android:layout_width="62dp" android:layout_height="62dp" android:text="⇅" android:textColor="#FFFFFF" android:background="@drawable/ios_circle_btn" android:layout_margin="6dp"/>
                      <Button android:id="@+id/btnWifi" android:layout_width="62dp" android:layout_height="62dp" android:text="WiFi" android:textColor="#FFFFFF" android:background="@drawable/ios_circle_btn" android:layout_margin="6dp"/>
                      <Button android:id="@+id/btnBluetooth" android:layout_width="62dp" android:layout_height="62dp" android:text="BT" android:textColor="#FFFFFF" android:background="@drawable/ios_circle_btn" android:layout_margin="6dp"/>
                  </LinearLayout>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:background="@drawable/ios_tile_bg" android:orientation="vertical" android:padding="16dp" android:layout_marginBottom="16dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="☀ Brightness" android:textColor="#FFFFFF"/>
                      <SeekBar android:id="@+id/seekBrightness" android:layout_width="match_parent" android:layout_height="wrap_content" android:max="255" android:progress="180" android:layout_marginBottom="12dp"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🔊 Volume" android:textColor="#FFFFFF"/>
                      <SeekBar android:id="@+id/seekVolume" android:layout_width="match_parent" android:layout_height="wrap_content" android:max="15" android:progress="10"/>
                  </LinearLayout>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center" android:layout_marginBottom="18dp">
                      <Button android:id="@+id/btnTorch" android:layout_width="66dp" android:layout_height="66dp" android:text="🔦" android:textSize="22sp" android:background="@drawable/ios_tile_bg" android:layout_margin="5dp"/>
                      <Button android:id="@+id/btnClock" android:layout_width="66dp" android:layout_height="66dp" android:text="⏰" android:textSize="22sp" android:background="@drawable/ios_tile_bg" android:layout_margin="5dp"/>
                      <Button android:id="@+id/btnCalc" android:layout_width="66dp" android:layout_height="66dp" android:text="🧮" android:textSize="22sp" android:background="@drawable/ios_tile_bg" android:layout_margin="5dp"/>
                      
