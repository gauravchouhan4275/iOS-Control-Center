name: Build PlushIcon 3D App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate PlushIcon Studio Project
        run: |
          mkdir -p app/src/main/java/com/gaurav/plushicon app/src/main/res/layout app/src/main/res/drawable
          A="android"
          NS="http://schemas.$://a.com"

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "PlushIcon"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.gaurav.plushicon'
              compileSdk 34
              defaultConfig { applicationId "com.gaurav.plushicon"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.google.android.gms:play-services-ads:23.0.0'
          }
          EOF

          cat << EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="$NS">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="com.android.launcher.permission.INSTALL_SHORTCUT" />
              <application android:allowBackup="true" android:label="PlushIcon" android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << EOF > app/src/main/res/drawable/card_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="$NS"><solid android:color="#1E1E24" /><corners android:radius="24dp" /><stroke android:width="1dp" android:color="#33FFFFFF" /></shape>
          EOF
          cat << EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="$NS" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0D0D12">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="20dp">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="PlushIcon 3D Studio" android:textColor="#FFFFFF" android:textSize="28sp" android:textStyle="bold" android:layout_marginTop="10dp"/>
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Create &amp; Apply 1000+ Live 3D Icons Instantly" android:textColor="#A0A0B0" android:textSize="14sp" android:layout_marginBottom="20dp"/>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:background="@drawable/card_bg" android:orientation="vertical" android:padding="20dp" android:gravity="center" android:layout_marginBottom="16dp">
                      <ImageView android:id="@+id/imgPreview" android:layout_width="130dp" android:layout_height="130dp" android:layout_marginBottom="12dp"/>
                      <TextView android:id="@+id/txtStyleInfo" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="3D Fluffy Pink • WhatsApp" android:textColor="#FFFFFF" android:textSize="16sp" android:textStyle="bold"/>
                  </LinearLayout>

                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="1. Choose App Icon" android:textColor="#FFFFFF" android:textStyle="bold" android:layout_marginBottom="8dp"/>
                  <HorizontalScrollView android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="16dp">
                      <LinearLayout android:id="@+id/layoutApps" android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="horizontal"/>
                  </HorizontalScrollView>

                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="2. Choose 3D Texture Style" android:textColor="#FFFFFF" android:textStyle="bold" android:layout_marginBottom="8dp"/>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:weightSum="4" android:layout_marginBottom="16dp">
                      <Button android:id="@+id/btnTexFluffy" android:layout_width="0dp" android:layout_height="46dp" android:layout_weight="1" android:text="Fluffy" android:textSize="11sp" android:backgroundTint="#FF6B9E" android:textColor="#FFFFFF" android:layout_margin="2dp"/>
                      <Button android:id="@+id/btnTexVelvet" android:layout_width="0dp" android:layout_height="46dp" android:layout_weight="1" android:text="Velvet" android:textSize="11sp" android:backgroundTint="#2C2C35" android:textColor="#FFFFFF" android:layout_margin="2dp"/>
                      <Button android:id="@+id/btnTexGlass" android:layout_width="0dp" android:layout_height="46dp" android:layout_weight="1" android:text="Glass" android:textSize="11sp" android:backgroundTint="#0A84FF" android:textColor="#FFFFFF" android:layout_margin="2dp"/>
                      <Button android:id="@+id/btnTexNeon" android:layout_width="0dp" android:layout_height="46dp" android:layout_weight="1" android:text="Neon" android:textSize="11sp" android:backgroundTint="#30D158" android:textColor="#FFFFFF" android:layout_margin="2dp"/>
                  </LinearLayout>

                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="3. Live Color Mixer (1000+ Shades)" android:textColor="#FFFFFF" android:textStyle="bold" android:layout_marginBottom="6dp"/>
                  <SeekBar android:id="@+id/seekHue" android:layout_width="match_parent" android:layout_height="wrap_content" android:max="360" android:progress="330" android:layout_marginBottom="16dp"/>

                  <Button android:id="@+id/btnRandomize" android:layout_width="match_parent" android:layout_height="50dp" android:text="🎲 Generate Random 3D Design" android:backgroundTint="#5E5CE6" android:textColor="#FFFFFF" android:layout_marginBottom="10dp"/>
                  <Button android:id="@+id/btnApplyHome" android:layout_width="match_parent" android:layout_height="56dp" android:text="✨ APPLY ICON TO HOME SCREEN" android:backgroundTint="#30D158" android:textColor="#FFFFFF" android:textStyle="bold" android:layout_marginBottom="16dp"/>
                  <FrameLayout android:id="@+id/adContainer" android:layout_width="match_parent" android:layout_height="wrap_content"/>
              </LinearLayout>
          </ScrollView>
          EOF

          cat << 'EOF' > app/src/main/java/com/gaurav/plushicon/MainActivity.kt
          package com.gaurav.plushicon
          import android.content.Intent; import android.content.pm.ShortcutInfo; import android.content.pm.ShortcutManager; import android.graphics.*; import android.graphics.drawable.Icon; import android.os.*; import android.widget.*; import androidx.appcompat.app.AppCompatActivity
          import com.google.android.gms.ads.*
          import java.util.Random

          class MainActivity : AppCompatActivity() {
              private var selectedPkg = "com.whatsapp"
              private var selectedAppName = "WhatsApp"
              private var selectedSymbol = "💬"
              private var textureMode = "Fluffy"
              private var hueValue = 330f
              private lateinit var currentBitmap: Bitmap

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  MobileAds.initialize(this) {}
                  val adView = AdView(this).apply { setAdSize(AdSize.BANNER); adUnitId = "ca-app-pub-3940256099942544/6300978111" }
                  findViewById<FrameLayout>(R.id.adContainer).addView(adView)
                  adView.loadAd(AdRequest.Builder().build())

                  val apps = listOf(
                      Triple("WhatsApp", "com.whatsapp", "💬"),
                      Triple("Instagram", "com.instagram.android", "📸"),
                      Triple("YouTube", "com.google.android.youtube", "▶️"),
                      Triple("Phone", "com.android.dialer", "📞"),
                      Triple("Camera", "com.android.camera", "📷"),
                      Triple("Chrome", "com.android.chrome", "🌐"),
                      Triple("Music", "com.google.android.music", "🎵"),
                      Triple("Gallery", "com.android.gallery3d", "🖼️")
                  )

                  val layoutApps = findViewById<LinearLayout>(R.id.layoutApps)
                  for (app in apps) {
                      val btn = Button(this).apply {
                          text = "${app.third} ${app.first}"
                          setTextColor(Color.WHITE)
                          setBackgroundColor(Color.parseColor("#252530"))
                          setPadding(28, 12, 28, 12)
                          val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                          lp.setMargins(8, 4, 8, 4); layoutParams = lp
                          setOnClickListener {
                              selectedAppName = app.first; selectedPkg = app.second; selectedSymbol = app.third
                              updatePreview()
                          }
                      }
                      layoutApps.addView(btn)
                  }

                  findViewById<Button>(R.id.btnTexFluffy).setOnClickListener { textureMode = "Fluffy"; updatePreview() }
                  findViewById<Button>(R.id.btnTexVelvet).setOnClickListener { textureMode = "Velvet"; updatePreview() }
                  findViewById<Button>(R.id.btnTexGlass).setOnClickListener { textureMode = "Glass"; updatePreview() }
                  findViewById<Button>(R.id.btnTexNeon).setOnClickListener { textureMode = "Neon"; updatePreview() }

                  val seekHue = findViewById<SeekBar>(R.id.seekHue)
                  seekHue.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) { hueValue = p.toFloat(); updatePreview() }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })

                  findViewById<Button>(R.id.btnRandomize).setOnClickListener {
                      val r = Random()
                      hueValue = r.nextInt(360).toFloat()
                      seekHue.progress = hueValue.toInt()
                      textureMode = listOf("Fluffy", "Velvet", "Glass", "Neon")[r.nextInt(4)]
                      updatePreview()
                  }

                  findViewById<Button>(R.id.btnApplyHome).setOnClickListener { applyToHomeScreen() }
                  updatePreview()
              }

              private fun updatePreview() {
                  findViewById<TextView>(R.id.txtStyleInfo).text = "3D $textureMode • $selectedAppName"
                  currentBitmap = render3DIcon(selectedSymbol, textureMode, hueValue)
                  findViewById<ImageView>(R.id.imgPreview).setImageBitmap(currentBitmap)
              }

              private fun render3DIcon(symbol: String, style: String, hue: Float): Bitmap {
                  val size = 256
                  val bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                  val c = Canvas(bmp)
                  val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  val baseColor = Color.HSVToColor(floatArrayOf(hue, if (style == "Velvet") 0.65f else 0.55f, if (style == "Velvet") 0.28f else 0.95f))
                  val lightColor = Color.HSVToColor(floatArrayOf(hue, 0.30f, 1.0f))
                  p.shader = LinearGradient(0f, 0f, size.toFloat(), size.toFloat(), lightColor, baseColor, Shader.TileMode.CLAMP)
                  val rect = RectF(16f, 16f, size - 16f, size - 16f)
                  c.drawRoundRect(rect, 64f, 64f, p)

                  p.shader = null
                  val r = Random(hue.toLong() + style.hashCode())
                  if (style == "Fluffy") {
                      p.color = Color.argb(75, 255, 255, 255)
                      for (i in 0..450) {
                          val fx = 24f + r.nextFloat() * (size - 48f)
                          val fy = 24f + r.nextFloat() * (size - 48f)
                          c.drawLine(fx, fy, fx + (r.nextFloat() - 0.5f) * 14f, fy - 8f, p)
                      }
                  } else if (style == "Glass") {
                      p.color = Color.argb(65, 255, 255, 255)
                      c.drawRoundRect(RectF(26f, 26f, size - 26f, size / 2f), 48f, 48f, p)
                  } else if (style == "Neon") {
                      p.style = Paint.Style.STROKE; p.strokeWidth = 8f; p.color = Color.WHITE
                      c.drawRoundRect(RectF(22f, 22f, size - 22f, size - 22f), 58f, 58f, p)
                      p.style = Paint.Style.FILL
                  }

                  p.color = Color.WHITE; p.textSize = 110f; p.textAlign = Paint.Align.CENTER
                  val yPos = (c.height / 2f) - ((p.descent() + p.ascent()) / 2f)
                  c.drawText(symbol, c.width / 2f, yPos, p)
                  return bmp
              }

              private fun applyToHomeScreen() {
                  val launchIntent = packageManager.getLaunchIntentForPackage(selectedPkg) ?: Intent(this, MainActivity::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val sm = getSystemService(ShortcutManager::class.java)
                      if (sm != null && sm.isRequestPinShortcutSupported) {
                          val pinInfo = ShortcutInfo.Builder(this, "plush_${selectedPkg}_${System.currentTimeMillis()}")
                              .setShortLabel(selectedAppName)
                              .setIcon(Icon.createWithBitmap(currentBitmap))
                              .setIntent(launchIntent)
                              .build()
                          sm.requestPinShortcut(pinInfo, null)
                          Toast.makeText(this, "Tap 'Add' to place 3D icon on Home Screen!", Toast.LENGTH_LONG).show()
                          return
                      }
                  }
                  Toast.makeText(this, "3D Icon Created!", Toast.LENGTH_SHORT).show()
              }
          }
          EOF

          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlushIcon-3D-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: PlushIcon-3D-AAB
          path: app/build/outputs/bundle/release/app-release.aab
