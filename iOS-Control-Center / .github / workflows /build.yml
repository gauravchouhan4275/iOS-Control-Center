name: Build iOS Control Center APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK & Release AAB
        run: ./gradlew assembleDebug bundleRelease

      - name: Upload APK for Testing
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Control-Center-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB for Play Store
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Control-Center-PlayStore-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          
